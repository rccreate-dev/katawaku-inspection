<title>型枠検査アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-column phone app, sticky top bar, role-based tabs, large touch targets for gloved hands on site. */
:root{
  --bg:#f1f2ee; --surface:#ffffff; --ink:#1b2420; --muted:#5b6862; --line:#d8dcd4;
  --accent:#0c6b67; --accent-ink:#ffffff; --accent-soft:#dcefed;
  --good:#1d7a3c; --good-soft:#dff1e4; --warn:#a85f00; --warn-soft:#fbecd3; --bad:#b3261e; --bad-soft:#fae0dd;
  --shadow:0 1px 2px rgba(20,30,25,.08);
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#1a211e; --ink:#e7eeea; --muted:#98a69f; --line:#2c3632;
    --accent:#42c2b9; --accent-ink:#04201e; --accent-soft:#183a38;
    --good:#62d088; --good-soft:#173a25; --warn:#f0b24c; --warn-soft:#3d2d10; --bad:#ff8c82; --bad-soft:#431d1a;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a211e; --ink:#e7eeea; --muted:#98a69f; --line:#2c3632;
  --accent:#42c2b9; --accent-ink:#04201e; --accent-soft:#183a38;
  --good:#62d088; --good-soft:#173a25; --warn:#f0b24c; --warn-soft:#3d2d10; --bad:#ff8c82; --bad-soft:#431d1a;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 32px}
#app{max-width:560px;margin-inline:auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-size:18px;min-width:0}
.mark{width:18px;height:18px;border-radius:4px;background:var(--accent);box-shadow:inset 0 0 0 4px var(--accent-soft);flex:none}
.ctl{display:flex;gap:8px;min-width:0}
select{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 8px;max-width:190px;min-width:0}
.lang{min-height:40px;min-width:48px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;font-weight:700}

.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;min-height:44px;border:0;background:none;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

h2{font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-size:15px;margin:20px 0 8px;color:var(--muted);letter-spacing:.04em}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.tap{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.tap[disabled]{opacity:.55;cursor:default}
.tap b{display:block}
.tap small{color:var(--muted);font-size:13px}
.btn{min-height:52px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 18px;width:100%}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.small{min-height:44px;width:auto}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:700;min-height:44px;padding:0 4px}

.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.st-none{background:var(--bg);color:var(--muted);border-color:var(--line)}
.st-draft{background:var(--accent-soft);color:var(--accent)}
.st-submitted{background:var(--warn-soft);color:var(--warn)}
.st-fix{background:var(--bad-soft);color:var(--bad)}
.st-qa_ok{background:var(--accent-soft);color:var(--accent)}
.st-approved{background:var(--good-soft);color:var(--good)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.ng{background:var(--bad-soft);color:var(--bad)}
.chip.na{background:var(--bg);color:var(--muted);border-color:var(--line)}

.banner{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.banner b{font-size:19px}
.banner.warn{background:var(--warn-soft)}
.banner.bad{background:var(--bad-soft)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}

.grp{font-size:14px;font-weight:700;color:var(--accent);margin:22px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--accent-soft)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item.err{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft)}
.q{display:flex;gap:10px;margin-bottom:10px}
.no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.key{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:0 6px;vertical-align:1px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg button{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.seg button[aria-pressed="true"].v-ok{background:var(--good);border-color:var(--good);color:#fff}
.seg button[aria-pressed="true"].v-ng{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[aria-pressed="true"].v-na{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.field{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;font-size:14px}
.field input[type=number]{width:96px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;margin-top:10px;resize:vertical}
.flag{color:var(--bad);font-weight:700}
.cmt{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt b{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em}
.cmt.mgr{border-left-color:var(--accent);background:var(--accent-soft)}
.cmt.mgr b{color:var(--accent)}
.msg{color:var(--bad);font-size:14px;font-weight:700;margin-top:6px}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;right:0;top:0;width:26px;height:26px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;border-radius:0 0 0 8px}
.cam{min-height:44px;border:1px dashed var(--accent);color:var(--accent);border-radius:10px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.cam svg{width:20px;height:20px}

.sig{display:block;width:100%;height:160px;border:2px dashed var(--line);border-radius:12px;background:var(--surface);touch-action:none}
.cells{display:flex;gap:8px;flex-wrap:wrap}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:52px;text-align:left}
.cell b{display:block;font-size:15px}
.cell[disabled]{opacity:.6;cursor:default}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:13px}
.scroll{overflow-x:auto}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log time{color:var(--muted);flex:none;width:92px;font-variant-numeric:tabular-nums}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet img.big{width:100%;border-radius:8px}
.note{color:var(--muted);font-size:13px;margin-top:24px}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters select{flex:1;max-width:none}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .2s}}
</style>

var CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function samplePhoto(label){
  var c=document.createElement('canvas');c.width=320;c.height=240;var x=c.getContext('2d');
  x.fillStyle='#8c9189';x.fillRect(0,0,320,240);x.fillStyle='#a9aea6';
  for(var i=0;i<8;i++){x.fillRect(0,i*30,320,2)}
  x.fillStyle='#fff';x.font='bold 20px sans-serif';x.fillText(label,16,110);
  x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,206,320,34);x.fillStyle='#fff';x.font='13px sans-serif';x.fillText('sample photo',10,228);
  return c.toDataURL('image/jpeg',0.6);
}
function stamp(file,label){
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var mx=640,sc=Math.min(1,mx/Math.max(img.width,img.height));
        var w=Math.round(img.width*sc),h=Math.round(img.height*sc);
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');x.drawImage(img,0,0,w,h);
        var bh=Math.max(26,Math.round(h*.09));
        x.fillStyle='rgba(0,0,0,.62)';x.fillRect(0,h-bh,w,bh);
        x.fillStyle='#fff';x.font='bold '+Math.round(bh*.5)+'px sans-serif';x.textBaseline='middle';x.fillText(label,10,h-bh/2);
        res(c.toDataURL('image/jpeg',.62));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    log:[{t:now-26*H,w:'u1',k:'submit',c:''},{t:now-25*H,w:'u3',k:'qaok',c:''},{t:now-24*H,w:'u3',k:'prime',c:''}]};
  recs['A|2F']={site:'A',floor:'2F',owner:'u1',status:'submitted',primeSigned:false,
    self:{results:s2,by:'u1',at:now-40*M,sign:true},qa:null,
    log:[{t:now-40*M,w:'u1',k:'submit',c:''}]};
  recs['B|1F']={site:'B',floor:'1F',owner:'u1',status:'fix',primeSigned:false,

    qa:{results:qres(s3,{i9:'ゆるみ2箇所を再度締め付けて、写真で確認します。'}),by:'u3',at:now-3*H,verdict:'minor',comment:'セパレーターの締付け不足。是正して再提出してください。',claimedBy:null},

  });
  var sug=hasNg?(hasKeyNg?'critical':'minor'):'ok';
  h+='<h3>'+t('verdict_h')+'</h3><div class="card"><div class="sub">'+t('v_hint')+': <b>'+t('v_'+sug)+'</b></div>'+
     '<label class="sr" for="qc">'+t('comment')+'</label><textarea id="qc" data-input="qcomment" placeholder="'+esc(t('comment'))+'"'+(mine?'':' disabled')+'>'+esc(q.comment||'')+'</textarea>'+
     (S.flash?'<div class="msg">'+esc(S.flash)+'</div>':'')+
     '<div class="stack" style="margin-top:12px"><button class="btn" data-act="verdict" data-v="ok"'+(mine?'':' disabled')+'>'+t('v_ok')+'</button>'+
     '<button class="btn ghost" data-act="verdict" data-v="minor"'+(mine?'':' disabled')+'>'+t('v_minor')+'</button>'+
     '<button class="btn ghost" style="color:var(--bad);border-color:var(--bad)" data-act="verdict" data-v="critical"'+(mine?'':' disabled')+'>'+t('v_critical')+'</button></div></div>';
  return h+logHtml(r);
}
function board(){
  var h='<h2>'+t('tab_board')+'</h2><p class="sub">'+esc(roleName(role()))+' '+esc(U().name)+'</p>';
  var sites=visibleSites();
  var pend=S.data.pending.filter(function(p){return isL()||SITES[p.site].main===S.user});
  if(pend.length){
    h+='<h3>'+t('pending_h')+'</h3>';
    pend.forEach(function(p,i){
      h+='<div class="card"><div class="row"><span><b>'+esc(nm(p.user))+'</b><br><span class="sub" style="margin:0">'+esc(SITES[p.site].name)+'</span></span><span style="display:flex;gap:8px"><button class="btn small" data-act="approve" data-i="'+S.data.pending.indexOf(p)+'">'+t('approve')+'</button><button class="btn small ghost" data-act="deny" data-i="'+S.data.pending.indexOf(p)+'">'+t('deny')+'</button></span></div></div>';
    });
  }
  var q=[];
  sites.forEach(function(s){SITES[s].floors.forEach(function(f){var r=rec(s,f);if(r&&r.status==='submitted')q.push(r)})});
  q.sort(function(a,b){return a.self.at-b.self.at});
  h+='<h3>'+t('queue_h')+'</h3>';
  if(!q.length)h+='<p class="sub">'+t('queue_none')+'</p>';
  q.forEach(function(r){
    var lv=esc_level(r),cl=r.qa&&r.qa.claimedBy;
    h+='<div class="card"><div class="row"><span><b>'+esc(SITES[r.site].name)+' ・ '+r.floor+'</b><br><span class="sub" style="margin:0">'+esc(nm(r.self.by))+' ・ '+t('by')+' '+ago(r.self.at)+'</span></span>'+
      (isQ()?'<button class="btn small" data-act="review" data-s="'+r.site+'" data-f="'+r.floor+'">'+t('check')+'</button>':'<button class="btn small ghost" data-act="openDetail" data-s="'+r.site+'" data-f="'+r.floor+'">'+t('open')+'</button>')+'</div>'+
      (cl?'<div class="sub" style="margin:8px 0 0">'+t('claimed_by')+': '+esc(nm(cl))+'</div>':'')+
      (lv?'<div class="msg" style="color:'+(lv===2?'var(--bad)':'var(--warn)')+'">'+t('esc'+lv)+'</div>':'')+'</div>';
  });
  h+='<h3>'+t('grid_h')+'</h3>';
  sites.forEach(function(s){
    h+='<div class="card"><b>'+esc(SITES[s].name)+'</b><div class="cells" style="margin-top:8px">';
    SITES[s].floors.forEach(function(f){
      var st=status(s,f),r=rec(s,f);
      h+='<button class="cell" data-act="'+(st==='submitted'&&isQ()?'review':'openDetail')+'" data-s="'+s+'" data-f="'+f+'"'+(r?'':' disabled')+'><b>'+f+'</b>'+chip(st)+'</button>';
    });
    h+='</div></div>';
  });
  return h;
}
function histView(){
  var sites=visibleSites(),list=[];
  sites.forEach(function(s){SITES[s].floors.forEach(function(f){var r=rec(s,f);if(r)list.push(r)})});
  list=list.filter(function(r){return (S.filter.site==='all'||r.site===S.filter.site)&&(S.filter.st==='all'||r.status===S.filter.st)});
  list.sort(function(a,b){return lastT(b)-lastT(a)});
  var so='<option value="all">'+t('all')+'</option>'+sites.map(function(s){return '<option value="'+s+'"'+(S.filter.site===s?' selected':'')+'>'+esc(SITES[s].name)+'</option>'}).join('');
  var to='<option value="all">'+t('all')+'</option>'+ST_ORDER.slice(1).map(function(s){return '<option value="'+s+'"'+(S.filter.st===s?' selected':'')+'>'+t('st_'+s)+'</option>'}).join('');
  var h='<h2>'+t('tab_hist')+'</h2><div class="filters"><label class="sr" for="fs">'+t('f_site')+'</label><select id="fs" data-change="fsite">'+so+'</select><label class="sr" for="ft">'+t('f_st')+'</label><select id="ft" data-change="fst">'+to+'</select></div>';
  if(!list.length)h+='<p class="sub">'+t('empty_hist')+'</p>';
  list.forEach(function(r){
    var c=counts(r.self.results);
    var other=isF()&&r.owner!==S.user;
    h+='<button class="tap" data-act="openDetail" data-s="'+r.site+'" data-f="'+r.floor+'"'+(other?' disabled':'')+'><span><b>'+esc(SITES[r.site].name)+' ・ '+r.floor+'</b><small>'+fmt(lastT(r))+' ・ '+esc(nm(r.self.by))+' ・ NG '+c.ng+'</small></span>'+chip(r.status)+'</button>';
  });
  return h;
}
function rosterView(){
  var h='<h2>'+t('roster_h')+'</h2><div class="card scroll"><table><thead><tr><th>'+t('f_site')+'</th><th>'+t('main')+'</th><th>'+t('sub')+'</th><th>'+t('foremen')+'</th></tr></thead><tbody>';
  Object.keys(SITES).forEach(function(s){
    h+='<tr><td>'+esc(SITES[s].name)+'</td><td>'+esc(nm(SITES[s].main))+'</td><td>'+esc(nm(SITES[s].sub))+'</td><td>'+(S.data.members[s].map(nm).join(', ')||'-')+'</td></tr>';
  });
  h+='</tbody></table></div><p class="sub">'+t('roster_rule')+'</p>';
  var all=0,ok=0;
  Object.keys(S.data.recs).forEach(function(k){var r=S.data.recs[k];if(r.status==='qa_ok'||r.status==='approved'){all++;if(!r.log.some(function(l){return l.k==='fix'}))ok++}});
  h+='<button class="btn ghost" data-act="reset">'+t('reset')+'</button><p class="note">'+t('demo_note')+'</p>';
  return h;
}
function modalHtml(){
  var m=S.modal;if(!m)return '';
  var h='<div class="scrim" data-act="closeModal"><div class="sheet" role="dialog" aria-modal="true">';
  if(m.n==='photo'){h+='<img class="big" alt="" src="'+m.src+'"><div style="height:12px"></div><button class="btn" data-act="closeModal">'+t('close')+'</button>'}
  if(m.n==='scan'){
    var ids=Object.keys(SITES).filter(function(s){return S.data.members[s].indexOf(S.user)<0&&!S.data.pending.some(function(p){return p.site===s&&p.user===S.user})});
    h+='<h2>'+t('scan_title')+'</h2><p class="sub">'+t('scan_help')+'</p>';
    if(!ids.length)h+='<p class="sub">'+t('scan_none')+'</p>';
    ids.forEach(function(s){h+='<button class="tap" data-act="doScan" data-s="'+s+'"><span><b>'+esc(SITES[s].name)+'</b></span><span class="chip st-draft">'+t('scan_btn')+'</span></button>'});
    h+='<button class="btn ghost" data-act="closeModal">'+t('close')+'</button>';
  }
  if(m.n==='report'){
    var r=rec(m.s,m.f),c=counts(r.self.results);
    h+='<h2>'+esc(SITES[r.site].name)+' ・ '+r.floor+'</h2><div class="card scroll"><table><tbody>'+
      '<tr><th>'+t('foreman_res')+'</th><td>'+esc(nm(r.self.by))+' '+fmt(r.self.at)+'</td></tr>'+
      '<tr><th>'+t('qa_sign')+'</th><td>'+(r.qa&&r.qa.verdict==='ok'?esc(nm(r.qa.by))+' '+fmt(r.qa.at)+' ('+t('v_ok')+')':'-')+'</td></tr>'+
      '<tr><th>'+t('prime')+'</th><td>'+(r.primeSigned?t('done'):t('notyet'))+'</td></tr>'+
      '<tr><th>OK / NG / '+t('na')+'</th><td>'+c.ok+' / '+c.ng+' / '+c.na+'</td></tr></tbody></table></div><p class="sub">'+t('report_note')+'</p><button class="btn" data-act="closeModal">'+t('close')+'</button>';
  }
  return h+'</div></div>';
}
function body(){
  var v=S.view.n;
  if(v==='site')return siteView();
  if(v==='form')return formView();
  if(v==='confirm')return confirmView();
  if(v==='review')return reviewView();
  if(v==='detail')return detailView();
  if(S.tab==='hist')return histView();
  if(S.tab==='roster'&&!isF())return rosterView();
  return isF()?foremanHome():board();
}
function render(keepScroll){
  var y=window.scrollY;
  $('#app').innerHTML=header()+(S.view.n==='home'?tabs():'')+'<main>'+body()+'</main>'+modalHtml();
  if(S.view.n==='confirm')initSig();
  if(keepScroll)window.scrollTo(0,y);
  save();
}

/* ---------- signature ---------- */
function initSig(){
  var c=$('#sigc');if(!c)return;
  var dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  c.width=w*dpr;c.height=h*dpr;
  var x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.5;x.lineCap='round';x.lineJoin='round';
  x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000';
  var d=false,lx=0,ly=0;S.sigDrawn=false;
  function pt(e){var b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}
  c.addEventListener('pointerdown',function(e){d=true;var p=pt(e);lx=p[0];ly=p[1];c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly+.1);x.stroke()});
  c.addEventListener('pointermove',function(e){if(!d)return;var p=pt(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(p[0],p[1]);x.stroke();lx=p[0];ly=p[1]});
  function up(){if(!d)return;d=false;S.sigDrawn=true;var b=$('#subbtn');if(b)b.disabled=false}
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
  c._clear=function(){x.clearRect(0,0,w,h);S.sigDrawn=false;var b=$('#subbtn');if(b)b.disabled=true};
}

/* ---------- actions ---------- */
function nav(v){S.stack.push(S.view);S.view=v;S.err=null;S.flash=null;window.scrollTo(0,0)}
function act(a,el){
  var d=el.dataset,k;
  switch(a){
    case 'lang':S.lang=S.lang==='ja'?'id':'ja';break;
    case 'tab':S.tab=d.t;S.view={n:'home'};S.stack=[];break;
    case 'back':S.view=S.stack.pop()||{n:'home'};S.err=null;S.flash=null;break;
    case 'openSite':nav({n:'site',site:d.s});break;
    case 'openFloor':
      k=d.s+'|'+d.f;
      if(!S.data.recs[k])S.data.recs[k]={site:d.s,floor:d.f,owner:S.user,status:'draft',primeSigned:false,self:{results:blank(),by:S.user,at:0,sign:false},qa:null,log:[]};
      if(['draft','fix'].indexOf(S.data.recs[k].status)>=0)nav({n:'form',site:d.s,floor:d.f});else nav({n:'detail',site:d.s,floor:d.f});
      break;
    case 'openDetail':nav({n:'detail',site:d.s,floor:d.f});break;
    case 'set':{var r=rec(S.view.site,S.view.floor);r.self.results[d.id].r=d.v;if(S.err)S.err=problems(r).filter(function(e){return S.err.some(function(x){return x.id===e.id})});break}
    case 'delph':{var r2=rec(S.view.site,S.view.floor);r2.self.results[d.id].photos.splice(Number(d.i),1);break}
    case 'zoom':{var rr=S.data.recs[d.k];var list=d.w==='self'?rr.self.results[d.id].photos:[];S.modal={n:'photo',src:list[Number(d.i)]};break}
    case 'closeModal':S.modal=null;break;
    case 'toConfirm':{var r3=rec(S.view.site,S.view.floor),p=problems(r3);if(p.length){S.err=p;render();var f=document.getElementById('it-'+p[0].id);if(f)f.scrollIntoView({block:'center'});return}nav({n:'confirm',site:r3.site,floor:r3.floor});break}
    case 'sigClear':{var c=$('#sigc');if(c&&c._clear)c._clear();return}
    case 'submit':{
      if(!S.sigDrawn)return;
      var r4=rec(S.view.site,S.view.floor),was=r4.status;
      r4.self.by=S.user;r4.self.at=Date.now();r4.self.sign=true;r4.status='submitted';
      if(r4.qa)r4.qa.claimedBy=null;
      logAdd(r4,was==='fix'?'resubmit':'submit');
      S.stack=[];S.view={n:'home'};S.tab='home';break}
    case 'review':{
      var r5=rec(d.s,d.f);
      if(!r5.qa||!r5.qa.results||r5.status==='submitted'&&!r5.qa.fresh){
        var res={};ITEMS.forEach(function(it){var x=r5.self.results[it.id];res[it.id]={r:x.r==='ng'?'ng':(x.r==='na'?'na':'ok'),val:x.val,note:''}});
        r5.qa={results:res,by:S.user,at:0,verdict:null,comment:'',claimedBy:null,fresh:true};
      }
      if(!r5.qa.claimedBy)r5.qa.claimedBy=S.user;
      nav({n:'review',site:d.s,floor:d.f});break}
    case 'takeover':{var r6=rec(S.view.site,S.view.floor);r6.qa.claimedBy=S.user;break}
    case 'qset':{var r7=rec(S.view.site,S.view.floor);r7.qa.results[d.id].r=d.v;S.flash=null;break}
    case 'verdict':{
      var r8=rec(S.view.site,S.view.floor),q=r8.qa,hasNg=ITEMS.some(function(it){return q.results[it.id].r==='ng'});
      if(d.v==='ok'&&hasNg){S.flash=t('ng_block');break}
      if(d.v!=='ok'&&!hasNg){S.flash=t('no_ng_block');break}
      q.verdict=d.v;q.by=S.user;q.at=Date.now();q.claimedBy=null;q.fresh=false;
      if(d.v==='ok'){r8.status='qa_ok';logAdd(r8,'qaok')}else{r8.status='fix';logAdd(r8,'fix',S.user,q.comment)}
      S.flash=null;S.stack=[];S.view={n:'home'};S.tab='home';break}
    case 'prime':{var r9=rec(d.s,d.f);r9.primeSigned=true;r9.status='approved';logAdd(r9,'prime');break}
    case 'report':S.modal={n:'report',s:d.s,f:d.f};break;
    case 'scan':S.modal={n:'scan'};break;
    case 'doScan':S.data.pending.push({site:d.s,user:S.user,at:Date.now()});S.modal=null;break;
    case 'approve':{var p1=S.data.pending[Number(d.i)];if(p1){S.data.members[p1.site].push(p1.user);S.data.pending.splice(Number(d.i),1)}break}
    case 'deny':S.data.pending.splice(Number(d.i),1);break;
    case 'reset':S.data=seed();S.view={n:'home'};S.stack=[];S.tab='home';S.modal=null;break;
  }
  render(['set','qset','delph','takeover'].indexOf(a)>=0);
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.classList.contains('scrim')&&e.target!==el)return;
  act(el.dataset.act,el);
});
document.addEventListener('input',function(e){
  var el=e.target,k=el.dataset&&el.dataset.input;if(!k)return;
  var id=el.dataset.id,r;
  if(k==='note'||k==='val'){
    r=rec(S.view.site,S.view.floor);var x=r.self.results[id];
    if(k==='note')x.note=el.value;else{x.val=el.value;var it=ITEMS.filter(function(i){return i.id===id})[0];var f=document.getElementById('fl-'+id);if(f)f.textContent=(el.value!==''&&Math.abs(Number(el.value))>it.tol)?t('over'):''}
  }
  if(k==='qval'){
    r=rec(S.view.site,S.view.floor);r.qa.results[id].val=el.value;var it2=ITEMS.filter(function(i){return i.id===id})[0];var f2=document.getElementById('qf-'+id);if(f2)f2.textContent=(el.value!==''&&Math.abs(Number(el.value))>it2.tol)?t('over'):'';
  }
  if(k==='qnote'){r=rec(S.view.site,S.view.floor);r.qa.results[id].note=el.value}
  if(k==='qcomment'){r=rec(S.view.site,S.view.floor);r.qa.comment=el.value}
  save();
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.change==='user'){S.user=el.value;S.view={n:'home'};S.stack=[];S.tab='home';S.modal=null;S.filter={site:'all',st:'all'};render();return}
  if(el.dataset.change==='fsite'){S.filter.site=el.value;render();return}
  if(el.dataset.change==='fst'){S.filter.st=el.value;render();return}
  if(el.dataset.photo&&el.files&&el.files[0]){
    var id=el.dataset.photo,r=rec(S.view.site,S.view.floor),n=ITEMS.map(function(i){return i.id}).indexOf(id)+1;
    stamp(el.files[0],SITES[r.site].name+' '+r.floor+' '+fmt(Date.now())+' '+U().name+' No.'+n).then(function(src){r.self.results[id].photos.push(src);render(true)});
  }
});

/* ---------- boot ---------- */
var saved=load();
if(saved&&saved.data){S.data=saved.data;S.user=saved.user||'u1';S.lang=saved.lang||'ja'}else{S.data=seed()}
render();
})();
</script>
